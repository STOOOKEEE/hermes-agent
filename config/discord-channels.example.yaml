      description: "Recherche, rédaction et opérations contrôlées sur X/Twitter."
      respond_without_mention: true
      use_threads: false
      toolsets:
        - agent_reach_reader
        - xactions_publisher
        - web
        - browser
        - vision
        - memory
        - skills
        - todo
        - session_search
        - clarify
        - no_mcp

