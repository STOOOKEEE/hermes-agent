services:
  engine:
    build: .
    image: artbytes-engine:latest
    container_name: artbytes-engine
    restart: unless-stopped
    # Run as the host user (hermes, uid 1001) so the bind-mounted SQLite DB
    # in ./data is writable, and the chmod-600 PK files are readable.
    user: "1001:1001"
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/engine.db
    volumes:
      - ./data:/app/data
      # Private keys live on the VM (chmod 600). Mount read-only.
      - /home/hermes/.hermes/secrets:/home/hermes/.hermes/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
